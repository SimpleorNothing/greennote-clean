<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenNote · 판서 → 확장 문제</title>
<meta name="description" content="판서 사진을 올리면 같은 단원 범위지만 판서에는 없는 내용으로 10문제를 내주는 도구">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#ffffff; --surface:#f6f7f9; --text:#1a1d21; --muted:#5b6470;
    --border:#e6e9ee; --brand:#1257d6;
    --ok:#1b8a5a; --ok-bg:#e8f6ef; --no:#c0392b; --no-bg:#fdeaea;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);}
  body{
    font-family:'Pretendard',system-ui,-apple-system,'Segoe UI',Roboto,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    color:var(--text); padding:48px 24px 96px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:680px;margin:0 auto;}

  header{margin-bottom:24px;}
  h1{font-size:28px;font-weight:800;letter-spacing:-.5px;margin:0 0 6px;}
  .sub{font-size:15px;color:var(--muted);margin:0;line-height:1.6;}

  .banner{margin-top:16px;display:none;background:#fff6e5;border:1.5px solid #f0d9a8;color:#8a6212;border-radius:12px;padding:11px 15px;font-size:13px;line-height:1.55;}
  .banner.show{display:block;}

  .dropzone{margin-top:22px;border:1.5px dashed var(--border);border-radius:14px;padding:40px 22px;text-align:center;color:var(--muted);font-size:14px;cursor:pointer;transition:.15s;background:var(--bg);}
  .dropzone:hover{border-color:var(--brand);}
  .dropzone.is-over{border-color:var(--brand);background:rgba(18,87,214,.06);}
  .dropzone .big{font-size:15px;color:var(--text);font-weight:600;margin-bottom:4px;}
  .dropzone .ico{font-size:30px;display:block;margin-bottom:10px;opacity:.5;}

  .update-stamp{position:fixed;left:14px;bottom:12px;font-size:11.5px;color:var(--muted);opacity:.7;z-index:80;pointer-events:none;}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:90;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ===== 퀴즈 (한 문제씩) ===== */
  .qz-loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:40px 4px}
  .qz-spin{width:16px;height:16px;border:2.5px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:qz-sp .7s linear infinite}
  @keyframes qz-sp{to{transform:rotate(360deg)}}
  .qz-err{color:var(--no);background:var(--no-bg);border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.6}

  .qz-top{display:flex;align-items:center;gap:10px;margin-bottom:30px}
  .qz-back{flex-shrink:0;border:none;background:none;color:var(--muted);font-size:24px;line-height:1;cursor:pointer;padding:2px 4px;border-radius:8px}
  .qz-back:hover{color:var(--text);background:var(--surface)}
  .qz-bar{flex:1;display:flex;gap:4px}
  .qz-seg{flex:1;height:6px;border-radius:999px;background:var(--border);transition:.2s}
  .qz-seg.done{background:var(--brand)}
  .qz-frac{flex-shrink:0;font-size:13px;font-weight:600;color:var(--muted)}
  .qz-pill{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:4px 11px;border-radius:999px}
  .qz-pill b{font-weight:800}
  .qz-pill.no{background:var(--no-bg);color:var(--no)}
  .qz-pill.ok{background:var(--ok-bg);color:var(--ok)}

  .qz-qrow{display:flex;gap:12px;margin-bottom:26px}
  .qz-qnum{flex-shrink:0;font-size:16px;font-weight:700;color:var(--text)}
  .qz-qtext{font-size:16px;font-weight:600;line-height:1.65;margin:0}

  .qz-opts{display:flex;flex-direction:column;gap:12px}
  .qz-opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:15px;line-height:1.55;background:var(--surface);color:var(--text);border:1.5px solid transparent;border-radius:14px;padding:16px 18px;cursor:pointer;transition:.12s}
  .qz-opt:hover:not(:disabled){background:#eef1f6}
  .qz-opt:disabled{cursor:default}
  .qz-opt .lt{flex-shrink:0;font-weight:700;color:var(--muted)}
  .qz-opt.sel{border-color:var(--brand)}
  .qz-opt.ok{background:var(--ok-bg);border-color:var(--ok)}
  .qz-opt.ok .lt{color:var(--ok)}
  .qz-opt.no{background:var(--no-bg);border-color:var(--no)}
  .qz-opt.no .lt{color:var(--no)}

  .qz-hintwrap{margin-top:22px}
  .qz-hintbtn{display:inline-flex;align-items:center;gap:6px;border:none;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:6px 4px;border-radius:8px}
  .qz-hintbtn:hover{color:var(--text)}
  .qz-hintbtn .arw{transition:transform .2s;font-size:12px}
  .qz-hintbtn.open .arw{transform:rotate(180deg)}
  .qz-hint{display:none;margin-top:10px;background:var(--surface);border-radius:14px;padding:15px 17px;font-size:14px;line-height:1.6;color:var(--text)}
  .qz-hint.show{display:block}
  .qz-hint .ico{margin-right:6px}

  .qz-exp{margin-top:14px;background:var(--ok-bg);border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.65;color:#15663f;display:none}
  .qz-exp.show{display:block}
  .qz-exp.no{background:var(--no-bg);color:#8a2a20}

  .qz-foot{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:16px 24px 22px;display:flex;justify-content:flex-end;z-index:70}
  .qz-foot-inner{width:100%;max-width:680px;margin:0 auto;display:flex;justify-content:flex-end}
  .qz-next{border:none;background:var(--brand);color:#fff;font:inherit;font-size:15px;font-weight:700;padding:13px 30px;border-radius:999px;cursor:pointer;transition:.12s}
  .qz-next:hover:not(:disabled){background:#0f49b3}
  .qz-next:disabled{opacity:.4;cursor:default}

  /* 결과 화면 */
  .qz-result{text-align:center;padding:30px 10px 10px}
  .qz-result .big{font-size:46px;font-weight:800;letter-spacing:-1px;margin:0 0 6px}
  .qz-result .big .tot{font-size:24px;color:var(--muted);font-weight:700}
  .qz-result .msg{font-size:15px;color:var(--muted);margin:0 0 26px;line-height:1.6}
  .qz-result-actions{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto}
  .qz-rbtn{font:inherit;font-size:15px;font-weight:700;padding:13px;border-radius:12px;cursor:pointer;transition:.12s}
  .qz-rbtn.primary{border:none;background:var(--brand);color:#fff}
  .qz-rbtn.primary:hover:not(:disabled){background:#0f49b3}
  .qz-rbtn.primary:disabled{opacity:.6;cursor:default}
  .qz-rbtn.ghost{border:1.5px solid var(--border);background:var(--bg);color:var(--muted)}
  .qz-rbtn.ghost:hover{border-color:var(--brand);color:var(--brand)}

  @media(max-width:640px){ body{padding:32px 16px 96px;} h1{font-size:24px;} .qz-foot{padding:14px 16px 18px} }
</style>
</head>
<body>
<div class="wrap">
  <header id="landing">
    <h1>📋 판서 → 확장 문제</h1>
    <p class="sub">판서(칠판) 사진을 올리면, <b>같은 단원 범위지만 판서에는 없는 내용</b>으로 10문제를 바로 내드려요.</p>
    <div class="banner" id="banner"></div>
  </header>

  <div class="dropzone" id="dropzone">
    <span class="ico">📷</span>
    <div class="big">판서 사진을 여기로 끌어다 놓거나 눌러서 올리기</div>
    <div>JPG · PNG · HEIC · 올리면 곧바로 10문제가 나와요</div>
  </div>
  <input type="file" id="fileInput" accept="image/*" hidden>

  <div id="quizArea"></div>
</div>

<div class="update-stamp" id="updateStamp">업데이트: 2026-06-18</div>
<div class="toast" id="toast"></div>

<script>
const Q_LEVEL = '고2';
const Q_COUNT = 10;

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1900); }
function banner(msg){ const b=document.getElementById('banner'); if(msg){ b.textContent=msg; b.classList.add('show'); } else b.classList.remove('show'); }
function esc(s){ return (s==null?'':''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ── 이미지 디코딩·압축 (HEIC 포함) ──
let _heicLib=null;
function loadHeic(){
  if(_heicLib) return _heicLib;
  _heicLib=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
    s.onload=()=> window.heic2any ? res(window.heic2any) : rej(new Error('heic-lib'));
    s.onerror=()=>rej(new Error('heic-lib'));
    document.head.appendChild(s);
  });
  return _heicLib;
}
function isHeic(file){ return /image\/hei[cf]/i.test(file.type||'') || /\.(heic|heif)$/i.test(file.name||''); }
async function toRenderable(file){
  if(!isHeic(file)) return file;
  const heic2any=await loadHeic();
  const out=await heic2any({ blob:file, toType:'image/jpeg', quality:0.9 });
  return Array.isArray(out) ? out[0] : out;
}
async function decodeImage(file){
  if(typeof createImageBitmap==='function'){
    try{ return await createImageBitmap(file,{imageOrientation:'from-image'}); }
    catch(_){ try{ return await createImageBitmap(file); }catch(_){ /* fall through */ } }
  }
  return await new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ URL.revokeObjectURL(url); res(img); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('decode')); };
    img.src=url;
  });
}
async function compress(file, maxDim=1200, q=0.72){
  file=await toRenderable(file);
  const src=await decodeImage(file);
  let w=src.width, h=src.height;
  if(!w || !h){ if(src.close) src.close(); throw new Error('empty'); }
  if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
  else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(src,0,0,w,h);
  if(src.close) src.close();
  const blob=await new Promise((res,rej)=> c.toBlob(b=> b?res(b):rej(new Error('blob')), 'image/jpeg', q));
  return blob;
}

// ── 사진 업로드 → 곧바로 퀴즈 ──
function setLandingVisible(on){
  document.getElementById('landing').style.display = on ? '' : 'none';
  document.getElementById('dropzone').style.display = on ? '' : 'none';
}
function quizReset(){
  greennoteQuiz.clearFoot();
  document.getElementById('quizArea').innerHTML='';
  setLandingVisible(true);
  window.scrollTo({top:0, behavior:'smooth'});
}

async function handleFile(file){
  if(!(file && (file.type.startsWith('image/') || isHeic(file) || /\.(jpe?g|png|gif|webp|heic|heif|bmp|tiff?)$/i.test(file.name||'')))){
    toast('이미지 파일이 아니에요'); return;
  }
  toast('판서를 읽는 중…');
  let blob;
  try{ blob=await compress(file); }
  catch(e){ console.error(e); toast('사진을 불러오지 못했어요 😢'); return; }
  setLandingVisible(false);
  greennoteQuiz.start(blob, Q_LEVEL, Q_COUNT);
}

const dz=document.getElementById('dropzone'), fi=document.getElementById('fileInput');
dz.onclick=()=>fi.click();
fi.onchange=()=>{ if(fi.files[0]){ handleFile(fi.files[0]); fi.value=''; } };
['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('is-over');}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('is-over');}));
dz.addEventListener('drop',e=>{ if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });

// ===== greennote 퀴즈 (판서 → 같은 범위·판서엔 없는 4지선다 10문제, 한 문제씩) =====
const greennoteQuiz = (function () {
  const LETTERS = ["A", "B", "C", "D", "E", "F"];
  let s = null;

  async function start(blob, level, count) {
    const area = document.getElementById("quizArea");
    clearFoot();
    area.innerHTML = '<div class="qz-loading"><span class="qz-spin"></span>판서를 읽고, 같은 범위에서 판서엔 없는 ' + count + '문제를 만드는 중…</div>';
    try {
      const data = await postImage("api/quiz-image", blob, { level, count });
      const qs = normQuestions(data.questions);
      if (!qs.length) throw new Error(data.error || "문제를 만들지 못했어요.");
      s = {
        questions: qs, idx: 0, picks: new Array(qs.length).fill(null),
        correct: 0, wrong: 0,
        meta: {
          subject: data.subject || "", scope: data.scope || "",
          summary: data.summary || "", keywords: data.keywords || [],
          level, asked: qs.map(q => q.question),
        },
      };
      renderQuestion();
    } catch (e) {
      area.innerHTML = '<div class="qz-err">문제 생성 실패 · ' + esc(e.message) + "</div>"
        + '<div style="margin-top:16px"><button class="qz-rbtn ghost" style="max-width:240px" onclick="quizReset()">다른 판서 올리기</button></div>';
      if (/GEMINI_API_KEY/.test(e.message)) banner("⚠️ 서버에 GEMINI_API_KEY가 설정되지 않아 문제 생성이 비활성화돼 있어요.");
    }
  }

  // 보기·정답을 안전한 형태로 정규화 (정답은 0-based 인덱스)
  function normQuestions(arr) {
    if (!Array.isArray(arr)) return [];
    const out = [];
    for (const q of arr) {
      let choices = Array.isArray(q.choices) ? q.choices.map(c => stripLead("" + c)) : [];
      choices = choices.filter(c => c !== "");
      if (choices.length < 2) continue; // 객관식만 사용
      let ans = answerIndex(q.answer, choices);
      if (ans < 0 || ans >= choices.length) ans = 0;
      out.push({
        question: "" + (q.question || ""), choices, answer: ans,
        hint: "" + (q.hint || ""), explanation: "" + (q.explanation || ""),
      });
    }
    return out;
  }
  function stripLead(c) {
    return c.replace(/^\s*[①②③④⑤⑥]\s*/, "").replace(/^\s*[A-Fa-f]\s*[.)]\s*/, "").replace(/^\s*[1-6]\s*[.)]\s*/, "").trim();
  }
  function answerIndex(a, choices) {
    const n = choices.length;
    if (typeof a === "number" && Number.isFinite(a)) {
      if (a >= 0 && a < n) return a;          // 0-based (프롬프트 규약)
      if (a >= 1 && a <= n) return a - 1;     // 모델이 1-based로 줄 때 방어
      return 0;
    }
    const t = ("" + (a == null ? "" : a)).trim();
    if (!t) return 0;
    if (/^[0-9]+$/.test(t)) { const k = parseInt(t, 10); return k >= 1 && k <= n ? k - 1 : (k >= 0 && k < n ? k : 0); }
    const sym = "①②③④⑤⑥".indexOf(t[0]); if (sym >= 0) return sym;
    const L = "ABCDEF".indexOf(t[0].toUpperCase()); if (L >= 0) return L;
    const norm = x => ("" + x).toLowerCase().replace(/\s+/g, "");
    const hit = choices.findIndex(c => norm(c) === norm(stripLead(t)));
    return hit >= 0 ? hit : 0;
  }

  function renderQuestion() {
    const area = document.getElementById("quizArea");
    const total = s.questions.length;
    const q = s.questions[s.idx];
    const answered = s.picks[s.idx] !== null;
    const pick = s.picks[s.idx];

    const segs = s.questions.map((_, i) => '<span class="qz-seg' + (i <= s.idx ? " done" : "") + '"></span>').join("");
    const opts = q.choices.map((c, i) => {
      let cls = "qz-opt";
      if (answered) {
        if (i === q.answer) cls += " ok";
        else if (i === pick) cls += " no";
      }
      return '<button type="button" class="' + cls + '" data-i="' + i + '"' + (answered ? " disabled" : "") + '>'
        + '<span class="lt">' + LETTERS[i] + ".</span><span>" + esc(c) + "</span></button>";
    }).join("");

    const expCls = answered ? (pick === q.answer ? "qz-exp show" : "qz-exp show no") : "qz-exp";

    area.innerHTML =
      '<div class="qz-top">'
        + '<button class="qz-back" title="처음으로" onclick="quizReset()">‹</button>'
        + '<div class="qz-bar">' + segs + "</div>"
        + '<span class="qz-frac">' + (s.idx + 1) + " / " + total + "</span>"
        + '<span class="qz-pill no">✕ <b id="qzWrong">' + s.wrong + "</b></span>"
        + '<span class="qz-pill ok">✓ <b id="qzRight">' + s.correct + "</b></span>"
      + "</div>"
      + '<div class="qz-qrow"><span class="qz-qnum">' + (s.idx + 1) + '.</span><p class="qz-qtext">' + esc(q.question) + "</p></div>"
      + '<div class="qz-opts" id="qzOpts">' + opts + "</div>"
      + (q.hint ? '<div class="qz-hintwrap"><button class="qz-hintbtn" id="qzHintBtn">힌트 보기 <span class="arw">▾</span></button>'
          + '<div class="qz-hint" id="qzHint"><span class="ico">💡</span>' + esc(q.hint) + "</div></div>" : "")
      + (q.explanation ? '<div class="' + expCls + '" id="qzExp"><b>해설 · </b>' + esc(q.explanation) + "</div>" : "");

    // 옵션 클릭
    if (!answered) {
      area.querySelectorAll(".qz-opt").forEach(btn => {
        btn.addEventListener("click", () => choose(parseInt(btn.dataset.i, 10)));
      });
    }
    // 힌트 토글
    const hb = document.getElementById("qzHintBtn");
    if (hb) hb.addEventListener("click", () => {
      hb.classList.toggle("open");
      document.getElementById("qzHint").classList.toggle("show");
    });

    renderFoot(answered, total);
  }

  function choose(i) {
    if (s.picks[s.idx] !== null) return;
    s.picks[s.idx] = i;
    const q = s.questions[s.idx];
    if (i === q.answer) s.correct++; else s.wrong++;
    renderQuestion();
  }

  function renderFoot(answered, total) {
    let foot = document.getElementById("qzFoot");
    if (!foot) {
      foot = document.createElement("div");
      foot.id = "qzFoot";
      foot.className = "qz-foot";
      foot.innerHTML = '<div class="qz-foot-inner"><button class="qz-next" id="qzNext"></button></div>';
      document.body.appendChild(foot);
    }
    const next = document.getElementById("qzNext");
    const last = s.idx >= total - 1;
    next.textContent = last ? "결과 보기" : "다음";
    next.disabled = !answered;
    next.onclick = () => {
      if (s.picks[s.idx] === null) return;
      if (last) { renderResult(); }
      else { s.idx++; renderQuestion(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    };
  }

  function clearFoot() { const f = document.getElementById("qzFoot"); if (f) f.remove(); }

  function renderResult() {
    clearFoot();
    const area = document.getElementById("quizArea");
    const total = s.questions.length;
    const correct = s.correct;
    const pct = Math.round((correct / total) * 100);
    const msg = pct >= 80 ? "훌륭해요! 같은 단원 확장 내용까지 잘 잡고 있어요."
      : pct >= 50 ? "좋아요. 틀린 문제의 해설을 한 번 더 보면 좋아요."
      : "판서 범위 주변 내용을 더 채워볼까요? 해설을 천천히 읽어보세요.";
    area.innerHTML =
      '<div class="qz-result">'
      + '<p class="big">' + correct + '<span class="tot"> / ' + total + "</span></p>"
      + '<p class="msg">' + (s.meta.subject || s.meta.scope ? esc([s.meta.subject, s.meta.scope].filter(Boolean).join(" · ")) + "<br>" : "") + msg + "</p>"
      + '<div class="qz-result-actions">'
        + '<button class="qz-rbtn primary" id="qzMore">🔄 같은 범위로 새 10문제</button>'
        + '<button class="qz-rbtn ghost" onclick="quizReset()">다른 판서 올리기</button>'
      + "</div></div>";
    document.getElementById("qzMore").addEventListener("click", loadMore);
  }

  async function loadMore() {
    const btn = document.getElementById("qzMore");
    if (!btn || !s) return;
    btn.disabled = true; btn.textContent = "새 문제 만드는 중…";
    try {
      const data = await postJSON("api/quiz-more", {
        subject: s.meta.subject, scope: s.meta.scope, level: s.meta.level, count: Q_COUNT,
        summary: s.meta.summary, keywords: s.meta.keywords, exclude: s.meta.asked.slice(-60),
      });
      const qs = normQuestions(data.questions);
      if (!qs.length) throw new Error(data.error || "문제를 만들지 못했어요.");
      s.questions = qs; s.idx = 0; s.picks = new Array(qs.length).fill(null);
      s.correct = 0; s.wrong = 0;
      s.meta.asked = s.meta.asked.concat(qs.map(q => q.question));
      renderQuestion();
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (e) {
      btn.disabled = false; btn.textContent = "🔄 같은 범위로 새 10문제";
      toast("새 문제 실패 · " + e.message);
    }
  }

  async function postImage(url, blob, params) {
    const qs = new URLSearchParams(params || {}).toString();
    const res = await fetch(url + (qs ? "?" + qs : ""), {
      method: "POST", headers: { "content-type": "image/jpeg" }, body: blob,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((data.error || ("요청 실패 (" + res.status + ")")) + (data.detail ? " — " + data.detail : ""));
    return data;
  }
  async function postJSON(url, payload) {
    const res = await fetch(url, {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((data.error || ("요청 실패 (" + res.status + ")")) + (data.detail ? " — " + data.detail : ""));
    return data;
  }

  return { start, clearFoot };
})();

// 업데이트 일시: 배포된 페이지의 Last-Modified(배포 시각)를 한국 시간 연월일시분으로 표시
(async()=>{
  const el=document.getElementById('updateStamp');
  if(!el) return;
  try{
    const r=await fetch(location.pathname,{method:'HEAD',cache:'no-store'});
    const lm=r.headers.get('last-modified');
    if(!lm) return;
    const d=new Date(lm);
    if(isNaN(d)) return;
    const f=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
    el.textContent='업데이트: '+f;
  }catch(_){}
})();
</script>
